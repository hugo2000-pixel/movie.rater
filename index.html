<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniRate | Movie Ratings Aggregator</title>
    <meta name="description" content="Get the true average rating for any movie from IMDb, Rotten Tomatoes, and Metacritic.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    
    <main class="container">
        <header class="hero">
            <h1 class="logo">Omni<span>Rate</span></h1>
            <p class="subtitle">The ultimate rating aggregator for every movie.</p>
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Search for a movie (e.g. The Matrix)" autocomplete="off">
                <button id="searchBtn" aria-label="Search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </div>
            <div id="statusMessage" class="status-message"></div>
        </header>

        <section id="resultsContainer" class="results-grid">
            <!-- Movie cards will be dynamically injected here -->
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
